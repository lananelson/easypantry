<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyPantry</title>
    <link
      href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #c15f3c;
        --accent-700: #a44c2d;
        --accent-soft: #fbf0e9;
        --accent-border: #f0d7c6;
        --ink: #1f2430;
        --muted: #6b7280;
        --line: #ececef;
        --surface: #ffffff;
        --page: #f7f5f2;
        --radius: 16px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04),
          0 10px 28px rgba(16, 24, 40, 0.06);
      }

      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--page);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .page,
      .page-wrapper,
      .page-body {
        background: transparent;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Bricolage Grotesque", "Inter", sans-serif;
        color: var(--ink);
        letter-spacing: -0.01em;
      }
      a {
        color: var(--accent-700);
        text-underline-offset: 2px;
      }
      a:hover {
        color: var(--accent);
      }

      /* Header: same warm surface as the page, so it reads as one canvas */
      .navbar {
        background: rgba(247, 245, 242, 0.9) !important;
        -webkit-backdrop-filter: saturate(140%) blur(10px);
        backdrop-filter: saturate(140%) blur(10px);
        border-bottom: 1px solid var(--line);
        box-shadow: none;
        position: sticky;
        top: 0;
        z-index: 1030;
      }
      .navbar .navbar-brand,
      .navbar .nav-link {
        font-family: "Bricolage Grotesque", "Inter", sans-serif;
      }
      .brand-mark {
        display: inline-block;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
        margin-right: 1.75rem;
        text-decoration: none;
      }
      .brand-mark:hover {
        color: var(--ink);
        text-decoration: none;
      }
      .brand-mark::after {
        content: ".";
        color: var(--accent);
      }
      .navbar .nav-link {
        position: relative;
        color: var(--muted);
        font-weight: 500;
        background: transparent;
      }
      .navbar .nav-link:hover {
        color: var(--ink);
      }
      /* One active indicator: ink text + a slim accent underline */
      .navbar .nav-item::after,
      .navbar .nav-item.active::after {
        display: none !important;
      }
      .navbar .nav-item.active .nav-link {
        background: transparent;
        color: var(--ink);
        font-weight: 600;
      }
      .navbar .nav-item.active .nav-link::after {
        content: "";
        position: absolute;
        left: 0.75rem;
        right: 0.75rem;
        bottom: 0.1rem;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
      }
      .page-body {
        margin-top: 1.75rem;
      }

      /* Cards */
      .card {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      /* Pantry urgency */
      .urgency-high {
        color: #d63939;
      }
      .urgency-medium {
        color: #f76707;
      }
      .urgency-low {
        color: #868e96;
      }

      /* Accordion / list tweaks */
      .accordion-button:not(.collapsed) {
        font-weight: normal;
      }
      .list-group-item:active,
      .list-group-item:focus {
        font-weight: normal;
      }

      /* Recipe browser */
      .recipe-search {
        width: min(100%, 26rem);
      }
      .recipe-card {
        overflow: hidden;
        color: inherit;
        border-radius: var(--radius);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .recipe-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(16, 24, 40, 0.13);
      }
      .recipe-card-img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        display: block;
      }
      .recipe-card-img-small {
        object-fit: contain;
        padding: 0.75rem;
      }
      .recipe-card-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 2.75rem;
        color: var(--accent);
        background: var(--accent-soft);
      }
      .recipe-card-title {
        font-family: "Bricolage Grotesque", "Inter", sans-serif;
        font-weight: 600;
        line-height: 1.3;
      }

      /* Recipe page */
      .recipe-view {
        max-width: 54rem;
        margin: 0 auto;
      }
      .recipe-hero {
        width: 100%;
        max-height: 26rem;
        object-fit: cover;
        cursor: zoom-in;
      }
      .recipe-body {
        padding: 2rem 2.25rem 2.25rem;
      }
      .recipe-title {
        font-family: "Bricolage Grotesque", "Inter", sans-serif;
        font-size: 2.4rem;
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
      }
      /* Header: title + meta on the left, small lead photo on the right.
         A grid (not a float) so the content below starts clean at full width. */
      .recipe-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.75rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .recipe-header.has-photo {
        grid-template-columns: minmax(0, 1fr) minmax(0, 320px);
      }
      .recipe-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.5rem;
        color: var(--muted);
        font-size: 0.95rem;
      }
      /* Separator stays with the item before it, so a wrapped line never starts with "·" */
      .recipe-meta span:not(:last-child)::after {
        content: "·";
        margin-left: 0.5rem;
      }
      .recipe-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: 0.9rem;
      }
      .recipe-tag {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 0.2rem 0.65rem;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-700);
      }
      .recipe-lead-figure {
        position: relative;
        margin: 0;
        justify-self: end;
      }
      .recipe-hero-figure {
        position: relative;
        margin: 0;
      }
      /* Photo credit: a small chip on the photo's corner, part of the image */
      .recipe-credit {
        position: absolute;
        right: 0.6rem;
        bottom: 0.6rem;
        margin: 0;
        padding: 0.15rem 0.55rem;
        border-radius: 999px;
        font-size: 0.7rem;
        line-height: 1.5;
        color: #fff;
        background: rgba(20, 20, 20, 0.42);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }
      .recipe-credit::before {
        content: "Photo: ";
        opacity: 0.8;
      }
      .recipe-lead-small {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: var(--shadow);
        cursor: zoom-in;
      }
      @media (max-width: 720px) {
        .recipe-header.has-photo {
          grid-template-columns: minmax(0, 1fr);
          gap: 1.1rem;
        }
        .recipe-lead-figure {
          order: -1;
          justify-self: start;
        }
      }
      @media (max-width: 576px) {
        .recipe-body {
          padding: 1.5rem 1.35rem 1.75rem;
        }
        .recipe-title {
          font-size: 2rem;
        }
      }
      .recipe-body::after {
        content: "";
        display: block;
        clear: both;
      }

      /* Markdown body typography */
      .markdown-body {
        color: #333a47;
        line-height: 1.7;
        font-size: 1rem;
      }
      .markdown-body h3 {
        font-family: "Bricolage Grotesque", "Inter", sans-serif;
        font-size: 1.3rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin: 2.25rem 0 0.6rem;
      }
      .markdown-body > div > h3:first-child {
        margin-top: 0.25rem;
      }
      .markdown-body h4 {
        font-size: 1.02rem;
        font-weight: 600;
        margin: 1.4rem 0 0.5rem;
      }
      .markdown-body p {
        margin: 0 0 0.75rem;
      }
      .markdown-body ul,
      .markdown-body ol {
        margin: 0 0 1rem;
        padding-left: 0;
        list-style: none;
      }
      .markdown-body ul li {
        position: relative;
        padding: 0.4rem 0 0.4rem 1.4rem;
        border-bottom: 1px solid #f3f3f4;
      }
      .markdown-body ul li:last-child {
        border-bottom: 0;
      }
      .markdown-body ul li::before {
        content: "";
        position: absolute;
        left: 0.2rem;
        top: 1.05rem;
        width: 0.4rem;
        height: 0.4rem;
        border-radius: 50%;
        background: var(--accent);
      }
      .markdown-body ol {
        counter-reset: step;
      }
      .markdown-body ol li {
        position: relative;
        padding: 0.15rem 0 1.1rem 2.75rem;
        counter-increment: step;
      }
      .markdown-body ol li::before {
        content: counter(step);
        position: absolute;
        left: 0;
        top: 0;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-700);
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        font-size: 0.92rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* "My Notes" — the owner's own voice, a deliberate callout */
      .my-notes {
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        border-radius: var(--radius);
        padding: 1.1rem 1.35rem;
        margin: 1.75rem 0;
      }
      .my-notes h3 {
        font-family: "Bricolage Grotesque", "Inter", sans-serif;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        color: var(--accent-700);
        margin: 0 0 0.5rem;
        padding: 0;
        border: 0;
      }
      .my-notes h3::before {
        content: "✦ ";
      }
      .my-notes ul {
        margin: 0;
      }
      .my-notes ul li {
        border: 0;
        padding: 0.15rem 0 0.15rem 1.4rem;
      }
      .my-notes ul li::before {
        top: 0.75rem;
      }
      .my-notes p {
        margin: 0;
      }

      /* Photo gallery */
      .recipe-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
        gap: 0.5rem;
      }
      .recipe-gallery img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 10px;
        cursor: zoom-in;
      }
      .recipe-lightbox {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        cursor: zoom-out;
      }
      .recipe-lightbox img {
        max-width: 100%;
        max-height: 88vh;
        object-fit: contain;
      }
      .recipe-lightbox-count {
        color: #ddd;
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }

      /* Meal plan dishes */
      .planned-dish {
        border-left: 3px solid var(--accent-border);
        padding-left: 0.6rem;
      }
      .planned-dish-name {
        font-weight: 500;
      }
      .planned-dish-skipped .planned-dish-name {
        text-decoration: line-through;
        color: #868e96;
      }
      .planned-dish details summary {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
  </body>
</html>
